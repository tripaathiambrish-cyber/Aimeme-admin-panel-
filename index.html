<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withdrawal Admin - AIMEME</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-black text-white p-4">
<div class="max-w-[600px] mx-auto">
<h1 class="text-[22px] font-black">👑 AIMEME ADMIN</h1>
<p class="text-[11px] opacity-50">withdrawal.html - Approval Panel</p>
<a href="/" class="text-[11px] opacity-60 underline">← Back to AIMEME.IN</a>

<div class="flex gap-2 mt-5">
<button onclick="setFilter('all')" id="bAll" class="px-4 py-2 bg-white/10 rounded-full text-[12px]">All</button>
<button onclick="setFilter('pending')" id="bPending" class="px-4 py-2 bg-[#FFD60A] text-black rounded-full text-[12px] font-bold">Pending</button>
<button onclick="setFilter('approved')" id="bApproved" class="px-4 py-2 bg-green-500/20 rounded-full text-[12px]">Approved</button>
<button onclick="setFilter('failed')" id="bFailed" class="px-4 py-2 bg-red-500/20 rounded-full text-[12px]">Failed</button>
</div>

<div id="list" class="mt-6 space-y-3">Loading requests...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDhZ6zYdaa0CD9r_HOtm5l7pBfkaxWeANY",
  authDomain: "aimeme-5ebf5.firebaseapp.com",
  databaseURL: "https://aimeme-5ebf5-default-rtdb.firebaseio.com",
  projectId: "aimeme-5ebf5",
  storageBucket: "aimeme-5ebf5.firebasestorage.app",
  messagingSenderId: "67906916932",
  appId: "1:67906916932:web:6bd44cb7d3e96e11916211"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentFilter='pending';
let allData={};

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('button[id^=b]').forEach(b=>b.className='px-4 py-2 bg-white/10 rounded-full text-[12px]');
  document.getElementById('b'+f.charAt(0).toUpperCase()+f.slice(1)).className='px-4 py-2 bg-[#FFD60A] text-black rounded-full text-[12px] font-bold';
  render();
}

function render(){
  let filtered = currentFilter==='all'? Object.entries(allData) : Object.entries(allData).filter(([k,v])=>v.status===currentFilter);
  document.getElementById('list').innerHTML=filtered.reverse().map(([key,w])=>`
  <div class="bg-[#121212] p-4 rounded-[16px] border border-white/10">
    <div class="flex justify-between items-start">
      <div><b class="text-[#FFD60A] text-[16px]">₹${w.amount}</b><span class="ml-2 text-[13px] font-bold">${w.name||'User'}</span></div>
      <span class="text-[10px] px-3 py-1 rounded-full font-black ${w.status==='pending'?'bg-[#FFD60A] text-black':w.status==='approved'?'bg-green-500 text-black':'bg-red-500 text-white'}">${w.status.toUpperCase()}</span>
    </div>
    <div class="mt-2 text-[13px]">UPI: <b class="bg-white/10 px-2 py-1 rounded">${w.upi}</b></div>
    <div class="text-[10px] opacity-40 mt-1">${new Date(w.time).toLocaleString()}</div>
    <div class="flex gap-2 mt-4">
      <button onclick="approve('${key}')" class="flex-1 bg-green-500 text-black py-3 rounded-xl font-black text-[12px]">✅ APPROVED</button>
      <button onclick="fail('${key}')" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-black text-[12px]">❌ FAILED</button>
      <button onclick="copyText('${w.upi}')" class="px-4 bg-white/10 rounded-xl text-[11px]">📋</button>
    </div>
  </div>`).join('') || `<p class="opacity-30 text-center py-10">No ${currentFilter} requests</p>`;
}

db.ref('withdrawals').on('value', snap=>{
  allData=snap.val()||{};
  render();
});

function approve(key){ db.ref('withdrawals/'+key).update({status:'approved'}).then(()=>alert('✅ Approved! User ko AIMEME.IN pe APPROVED dikhega')); }
function fail(key){ db.ref('withdrawals/'+key).update({status:'failed'}).then(()=>alert('❌ Failed kar diya! User ko FAILED dikhega')); }
function copyText(t){ navigator.clipboard.writeText(t); alert('Copied: '+t); }
</script>
</body>
</html>
